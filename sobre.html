<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;min-height:100%}
  body{
    min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:16px;gap:14px;
    background:radial-gradient(120% 90% at 50% 0%,#faf0f1 0%,#f0d9dc 60%,#e4c4c8 100%);

  }
  .envelope{
    display:block;
    width:min(420px,100%);
    border-radius:16px;
    overflow:hidden;

    transition:transform .25s ease, box-shadow .25s ease;
  }
  .envelope:hover,.envelope:focus-visible{
    transform:translateY(-3px);
    box-shadow:0 32px 70px -20px rgba(92,49,60,.55), 0 6px 18px rgba(138,109,31,.25);
    outline:2px solid #b9911f;
    outline-offset:4px;
  }
  .envelope img{
    display:block;
    width:100%;
    height:auto;
  }
  .dl{
    font-size:12px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:#7a4552;
    text-decoration:none;
    padding:8px 16px;
    border-radius:999px;
    border:1px solid rgba(122,69,82,.28);
    background:rgba(255,255,255,.65);
  }
  .dl:hover{background:#7a4552;color:#fff}
</style>
</head>
